{% load i18n humanize %}

{% with stats=object.get_daily_stats %}
{% if stats.currently_online > 0 %}
<span class="pill pill--online whitespace-nowrap text-base">
    <span class="pill__dot"></span>{{stats.currently_online|intcomma}} {% trans 'online' %}
</span>
{% else %}
<span class="pill pill--idle whitespace-nowrap text-base">
    <span class="pill__dot"></span>{% trans 'Idle' %}
</span>
{% endif %}
{% endwith %}
