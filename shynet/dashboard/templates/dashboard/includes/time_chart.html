{% load i18n %}
{% if not sparkline %}
<div class="flex items-center justify-between flex-wrap gap-2 px-2 pt-1">
    <div class="flex items-center" style="gap: 1rem; font-size: 0.8rem; color: var(--global-text-color-light)">
        <span class="flex items-center" style="gap: 0.35rem">
            <span style="display:inline-block;width:0.75rem;height:0.75rem;border-radius:3px;background:var(--bar-fill);border:1px solid var(--global-theme-color)"></span>
            {% trans 'Hits' %}
        </span>
        <span class="flex items-center" style="gap: 0.35rem">
            <span style="display:inline-block;width:0.9rem;height:0;border-top:2px solid var(--global-theme-color)"></span>
            {% trans 'Sessions' %}
        </span>
    </div>
    {% if granularity == "daily" and click_zoom %}
    <span style="font-size: 0.75rem; color: var(--global-text-color-light)">{% trans 'Click a day to zoom in.' %}</span>
    {% endif %}
</div>
{% endif %}
<div id="chart{{name|default:'Main'}}"></div>
<script>
    (function () {
        var styles = getComputedStyle(document.documentElement);
        var themeColor = styles.getPropertyValue('--global-theme-color').trim() || '#a83d6d';
        var barFill = styles.getPropertyValue('--bar-fill').trim() || 'rgba(168,61,109,0.12)';
        var divider = styles.getPropertyValue('--global-divider-color').trim() || 'rgba(0,0,0,0.1)';
        var textLight = styles.getPropertyValue('--global-text-color-light').trim() || '#767676';

    var triggerMatchesChartOptions = {
        dataLabels: {
            enabled: false
        },
        tooltip: {
            shared: true,
            theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light',
            x: {
                format: '{{tooltip_format|default:"MMM d"}}',
            },
        },
        legend: {
            show: false,
        },
        chart: {
            zoom: {
                enabled: false,
            },
            toolbar: {
                show: false,
            },
            type: 'line',
            height: {{height|default:"200"}},
            offsetY: -1,
            animations: {
                enabled: false
            },
            sparkline: {
                enabled: {% if sparkline %}true{% else %}false{% endif %},
            },
            {% if granularity == "daily" and click_zoom %}
            events: {
                markerClick: function(event, chartContext, { seriesIndex, dataPointIndex, w: {config}}) {
                    const day = config.labels[dataPointIndex]
                    window.location.href = `?startDate=${day}&endDate=${day}`
                },
            },
            {% endif %}
        },
        grid: {
            borderColor: divider,
            padding: {
                right: 0,
                left: -8,
            },
            xaxis: {
                lines: {
                    show: true,
                }
            },
            yaxis: {
                lines: {
                    show: false,
                }
            },
            show: true
        },
        yaxis: {
            labels: {
                show: false,
                formatter: val => val.toFixed(0)
            },
            padding: {
                left: 0,
            }
        },
        xaxis: {
            type: "datetime",
            labels: {
                datetimeUTC: false,
                style: { colors: textLight }
            },
        },
        stroke: {
            width: 2,
            curve: 'smooth',
        },
        fill: {
            type: ['solid', 'solid'],
            opacity: [1, 1],
        },
        series: [{
            name: "Hits",
            type: 'area',
            color: barFill,
            data: {{data.hits|safe}}
        }, {
            name: "Sessions",
            type: 'line',
            color: themeColor,
            data: {{data.sessions|safe}}
        }],
        labels: {{data.labels|safe}}
    };
    var triggerMatchesChart = new ApexCharts(document.querySelector("#chart{{name|default:'Main'}}"), triggerMatchesChartOptions);
    triggerMatchesChart.render();
    })();
</script>
